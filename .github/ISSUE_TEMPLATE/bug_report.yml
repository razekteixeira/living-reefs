name: Bug report
description: Something is wrong or crashes
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The reef layout (depth, biome, coral kinds), your config and the commands you ran help a lot.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Minecraft, Fabric Loader, Fabric API, Living Reefs
      placeholder: 26.3, 0.19.5, 0.162.0+26.3, 1.0.0-beta.1
    validations:
      required: true
  - type: textarea
    id: mods
    attributes:
      label: Other mods
      description: Especially worldgen mods, mods that add coral, and performance mods.
  - type: textarea
    id: log
    attributes:
      label: Log or crash report
      description: Paste latest.log or link a paste service.
      render: text
